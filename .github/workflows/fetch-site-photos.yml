name: fetch-site-photos
on:
  push:
    branches: [media]
    paths: ["assets/site/urls.txt"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { ref: media }
      - name: Download
        run: |
          cd assets/site
          grep -v '^#' urls.txt | grep . | while read -r u; do
            f=$(basename "${u%%\?*}" | sed 's/[^A-Za-z0-9._-]/_/g')
            [ -f "$f" ] || curl -fsSL -A "Mozilla/5.0" "${u// /%20}" -o "$f" || echo "fail $u"
          done
          ls -la
      - name: Commit
        run: |
          git config user.name "fetch-bot"; git config user.email "fetch-bot@users.noreply.github.com"
          git add -A assets/site; git diff --cached --quiet && exit 0
          git commit -m "site photos [skip ci]"; git pull --rebase -q origin media; git push -q origin HEAD:media
