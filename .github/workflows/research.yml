name: research-shorts
on:
  push:
    branches: [media]
    paths: ["tools/research_shorts.py"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with: { ref: media }
      - run: pip install -q yt-dlp
      - run: python3 tools/research_shorts.py
      - name: Commit
        run: |
          rm -rf research/subs
          git config user.name "research-bot"; git config user.email "research-bot@users.noreply.github.com"
          git add research; git diff --cached --quiet && exit 0
          git commit -m "research: shorts [skip ci]"; git pull --rebase -q origin media; git push -q origin HEAD:media
